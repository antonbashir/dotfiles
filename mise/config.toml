[settings]
trusted_config_paths = ["/"]

[tasks."mount:backup"]
run = "bash $HOME/development/infrastructure/actions/mount-backup.sh"

[tasks."unmount:backup"]
run = "bash $HOME/development/infrastructure/actions/unmount-backup.sh"

[tasks."mount:cold"]
run = "bash $HOME/development/infrastructure/actions/mount-cold.sh"

[tasks."unmount:cold"]
run = "bash $HOME/development/infrastructure/actions/unmount-cold.sh"

[tasks.backup]
run = "bash $HOME/development/infrastructure/actions/backup.sh"

[tasks."bots:currency"]
run = "bash $HOME/development/infrastructure/actions/currency-bot.sh"

[tasks."wallpapers:start"]
run = 'lianwall start'

[tasks."wallpapers:stop"]
run = 'lianwall stop'

[tasks."repository:refresh"]
run = 'bash $HOME/development/infrastructure/actions/repository-refresh.sh'

[tasks."services:refresh"]
run = 'bash $HOME/development/infrastructure/actions/services-refresh.sh'

[tasks."clang:format:all"]
run = "find . -regex '.*\\.\\(c++\\cpp\\|hpp\\|cc\\|cxx\\|c\\|h\\)' -exec clang-format -style=file -i {} \\;"

[tasks."clang:format:configure"]
run = "cp $HOME/.clang-format {{cwd}}"
