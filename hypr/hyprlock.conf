general {
  immediate_render = true
  hide_cursor = true
}

animations {
  enabled = 0
}

background {
  monitor =
  path = ~/.config/backgrounds/lockscreen.jpg
  color = 0x121418ff
  blur_passes = 0
}

input-field {
  monitor =
  size = 550, 100
  outline_thickness = 1
  inner_color = rgba(18, 20, 24, 0.55)
  check_color = rgba(201, 204, 208, 0.8)
  fail_color = rgba(243, 139, 168, 0.9)
  fail_text = <span foreground="#E6E8EA">Ошибок: <b>$ATTEMPTS</b></span>
  font_color = rgb(230, 232, 234)
  fade_on_empty = false
  rounding = 32
  position = 0, -20
  halign = center
  valign = center
  placeholder_text =  
  swap_font_color = false
}

label {
  monitor =
  text = Приветствую, $USER
  font_size = 48
  font_family = Geist
  color = rgb(230, 232, 234)
  position = 0, 100
  halign = center
  valign = center
}

label {
  monitor =
  text = $TIME
  font_size = 64
  font_family = Geist Bold
  color = rgb(242, 243, 244)
  position = 0, 366
  halign = center
  valign = center
}

image {
  monitor =
  path = ~/.face
  size = 128
  rounding = 64
  position = 0, 216
  halign = center
  valign = center
}