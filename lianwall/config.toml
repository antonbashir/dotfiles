[paths]
mode = "Video"
video_dir = "/home/anton/videos/backgrounds"
image_dir = "/home/anton/pictures/backgrounds"

[video_engine]
backend = "mpvpaper"
fit = "crop"
decode = "software"
interval = 120
display = "*"
mpvpaper_args = ["--profile=wallpaper"]
mpv_args = [
    "--sws-scaler=fast-bilinear",
    "--scale=bilinear",
    "--dscale=bilinear",
    "--cscale=bilinear",
    "--gpu-api=vulkan",
    "--deband=no",
    "--dither=ordered",
    "--no-audio",
    "--loop=inf",
    "--hwdec=auto-safe",
    "--video-zoom=0",
    "--panscan=1.0",
]
ipc_socket = ""
switch_delay_ms = 100
transition = "none"
transition_ms = 400
transition_fps = 60

[image_engine]
backend = "awww"
fit = "crop"
transition = "fade"
transition_ms = 400
transition_fps = 60
interval = 600
outputs = ""
awww_args = [
    "--transition-type=fade",
    "--transition-duration=2.0",
    "--transition-fps=60",
    "--transition-step=20",
    "--resize=crop",
]

[algorithm]
strategy = "clockwise_biased_softmax"
bias_lambda = 0.35
temperature = 0.28

[vram]
enabled = true
threshold_percent = 25.0
recovery_percent = 40.0
check_interval = 2
cooldown_seconds = 30
backend = "auto"
custom_command = ""

[daemon]
socket_path = "/tmp/lianwall.sock"
pid_path = "/tmp/lianwall.pid"
log_level = "info"
