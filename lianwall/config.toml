[paths]
image_dir = "~/pictures/backgrounds"
mode = "Video"
video_dir = "~/videos/backgrounds"

[video_engine]
display = "*"
interval = 30
mpv_args = [
  "--sws-scaler=fast-bilinear",
  "--scale=bilinear",
  "--dscale=bilinear",
  "--cscale=bilinear",
  "--profile=fast",
  "--gpu-api=vulkan",
  "--deband=no",
  "--dither=no",
  "--interpolation=no",
  "--no-audio",
  "--loop=inf",
  "--hwdec=auto",
  "--video-zoom=0",
  "--panscan=1.0",
]
mpvpaper_args = [
  "--profile=wallpaper",
]

[image_engine]
interval = 600
outputs = ""
swww_args = [
  "--transition-type=fade",
  "--transition-duration=2.0",
  "--transition-fps=60",
  "--transition-step=20",
  "--resize=crop",
]

[algorithm]
bias_lambda = 0.35
strategy = "clockwise_biased_softmax"
temperature = 0.28

[vram]
backend = "auto"
check_interval = 2
cooldown_seconds = 30
custom_command = ""
enabled = true
recovery_percent = 40.0
threshold_percent = 25.0

[daemon]
log_level = "info"
pid_path = "/tmp/lianwall.pid"
socket_path = "/tmp/lianwall.sock"
